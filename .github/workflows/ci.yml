name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.10"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          enable-cache: false
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          enable-cache: false
      - run: uv sync --locked
      - name: mypy
        run: uv run mypy src tests

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ORDERCALC_API_URL: https://api.ordercalc.example
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          enable-cache: false
      - run: uv sync --locked
      - name: pytest
        run: uv run pytest -v

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
          enable-cache: false
      - name: export requirements
        run: uv export --locked --no-dev --no-emit-project --format requirements-txt > requirements.txt
      - name: pip-audit
        run: uvx pip-audit@2.10.1 --disable-pip --strict -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build -t ordercalc:${{ github.sha }} .
      - name: smoke test
        run: docker run --rm -e ORDERCALC_API_URL=https://api.ordercalc.example ordercalc:${{ github.sha }}
